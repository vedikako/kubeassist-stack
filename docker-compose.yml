# KubeAssist-stack root compose — glue only.
# Go is developed/run on the HOST (`go run ./cmd/server`) with Kind kubeconfig.
# Postgres + AI run in Compose. Optional backend-go service is for full-container demos.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kubeassist
      POSTGRES_PASSWORD: kubeassist_dev_password
      POSTGRES_DB: kubeassist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeassist"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      # Junction-as-context works on Windows; nested COPY of junctions does not.
      context: ./ai-service
      dockerfile: ../Dockerfile.ai
    environment:
      LLM_MOCK: ${LLM_MOCK:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      AI_SHARED_TOKEN: ${AI_SHARED_TOKEN:-dev-shared-token-change-me}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      HOST: "0.0.0.0"
      PORT: "8000"
    volumes:
      # paths.py: WORKDIR /app → REPO_ROOT=/ → SCHEMAS_DIR=/schemas
      - ./schemas:/schemas:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Optional: fully containerized Go (needs kubeconfig mount). Prefer host `go run` for Kind on Windows.
  # backend-go:
  #   build:
  #     context: ./backend-go
  #   environment:
  #     PORT: "8080"
  #     KUBECONFIG: /kubeconfig/config
  #     KUBE_CONTEXT: kind-kubeassist-dev
  #     DATABASE_URL: postgres://kubeassist:kubeassist_dev_password@postgres:5432/kubeassist?sslmode=disable
  #     AI_BASE_URL: http://ai-service:8000
  #     AI_AUTH_TOKEN: ${AI_AUTH_TOKEN:-dev-shared-token-change-me}
  #     CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
  #   volumes:
  #     - ${USERPROFILE}/.kube/config:/kubeconfig/config:ro
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     ai-service:
  #       condition: service_healthy

volumes:
  postgres-data:
